[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mi300x-bench"
version = "0.1.0"
description = "Closed-loop LLM inference benchmark for OpenAI-compatible servers, aimed at AMD Instinct MI300X."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "benchmark", "vllm", "rocm", "mi300x"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.6"]

[project.scripts]
mi300x-bench = "mi300x_bench.cli:main"

[project.urls]
Homepage = "https://github.com/GFFCC66/mi300x-llm-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
